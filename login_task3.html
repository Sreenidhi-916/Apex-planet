<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - SkillSphere</title>
  <link rel="stylesheet" href="style_task2.css">
</head>
<body>
  <nav class="navbar">
     <a href="index_task3.html">🏠 Home</a>
        <a href="login_task3.html">🔐 Login</a>
        <a href="quiz_task2.html">🧠 Quiz</a>

        <a href="todo_task3.html">📝 To-Do</a>
        <a href="contact_task3.html">📩 Contact</a>s
  </nav>

  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit">Login</button>
      <p id="login-error" class="error"></p>
    </form>
    <p>Don't have an account? <a href="#">Register here</a></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const error = document.getElementById("login-error");

      if (!email || !password) {
        error.textContent = "❌ Credentials not satisfied. Please fill all fields.";
        e.preventDefault();
      } else {
        error.textContent = "";
        alert("✅ Login successful!");
      }
    });
  </script>
</body>
</html>
