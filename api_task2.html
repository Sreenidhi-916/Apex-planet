  <div class="login-box">
    <h2>😂 Get a Random Joke</h2>
    <button onclick="getJoke()">Fetch Joke</button>
    <p id="jokeDisplay" style="margin-top: 20px; font-weight: bold;"></p>
  </div>

  <script>
    async function getJoke() {
      const jokeDisplay = document.getElementById("jokeDisplay");
      jokeDisplay.textContent = "⏳ Loading...";
      
      try {
        const response = await fetch("https://official-joke-api.appspot.com/random_joke");
        const data = await response.json();
        jokeDisplay.textContent = `🤣 ${data.setup} — ${data.punchline}`;
      } catch (error) {
        jokeDisplay.textContent = "❌ Failed to fetch joke. Try again.";
        console.error("Error fetching joke:", error);
      }
    }
  </script>
</body>
